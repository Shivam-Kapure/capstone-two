apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-deployment
  labels:
    app: capstone
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone
      tier: backend
  template:
    metadata:
      labels:
        app: capstone
        tier: backend
    spec:
      containers:
        - name: payment-api
          image: payment-backend:capstone-two
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-backend
  labels:
    app: capstone
    tier: backend
spec:
  type: ClusterIP
  selector:
    tier: backend
  # Payments live in memory per replica; keep each client on one pod so a new payment survives a refresh.
  sessionAffinity: ClientIP
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-frontend
  labels:
    app: capstone
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone
      tier: frontend
  template:
    metadata:
      labels:
        app: capstone
        tier: frontend
    spec:
      containers:
        - name: payment-ui
          image: payment-frontend:capstone-two
          imagePullPolicy: Never
          env:
            - name: BACKEND_URL
              value: http://capstone-backend:8000
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-nodeport
  labels:
    app: capstone
    tier: frontend
spec:
  type: NodePort
  selector:
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30199
